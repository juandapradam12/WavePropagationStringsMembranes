[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefd"
version = "1.0.0"
description = "Explicit finite-difference solvers for the 1D and 2D wave equation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan David Prada Malagon" }]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["wavefd*"]
